name: Bereza Launcher v2

on:
  push:
    branches: [ launcher-v2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests + APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease 2>&1 | tee build.log

      - name: Live query 188.127.241.74:2406
        if: success()
        continue-on-error: true
        env:
          LIVE_QUERY: "1"
        run: ./gradlew --no-daemon testDebugUnitTest --tests '*SampQueryTest.liveServer' --rerun 2>&1 | grep -E "LIVE|PASSED|FAILED|SKIPPED" || true

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:|FAILED|Exception|expected|> " build.log | head -80 > errors.txt || true
          cat errors.txt
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)
          echo "::error title=Gradle build failed::${msg}"

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/BerezaRP-Launcher.apk
          cp app/build/outputs/apk/debug/*.apk out/BerezaRP-Launcher-debug.apk
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: bereza-launcher-v2
          path: out/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v2-${{ github.run_number }}
          name: Bereza RP Launcher v2 (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            out/BerezaRP-Launcher.apk
            out/BerezaRP-Launcher-debug.apk
            out/SHA256SUMS.txt
