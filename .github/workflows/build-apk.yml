name: Build Bereza Launcher APK

on:
  push:
    branches: [ main, master, launcher ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|error:|Could not|> " build.log | head -60 > errors.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' errors.txt)
          echo "::error title=Gradle build failed::${msg}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bereza-launcher-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-build-${{ github.run_number }}
          name: Bereza RP Launcher (debug ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: app/build/outputs/apk/debug/*.apk
