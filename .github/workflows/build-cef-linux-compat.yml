name: Build CEF linux plugin (old glibc)

on:
  push:
    branches: [ cef-build ]
    paths: [ '.github/workflows/build-cef-linux-compat.yml' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  CEF_REPO: Pycckue-Bnepeg/samp-cef
  CEF_REF: f14fe4fa7f0d036edf445ba02b4bddd4cccac377

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.CEF_REPO }}
          ref: ${{ env.CEF_REF }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Build (glibc 2.17)
        run: |
          cargo install cargo-zigbuild --locked
          cargo zigbuild --package cef-server --release --target i686-unknown-linux-gnu.2.17
          cp target/i686-unknown-linux-gnu/release/libcef_server.so cef-server-linux-compat.so
          strip -s cef-server-linux-compat.so || true
          objdump -T cef-server-linux-compat.so | grep -o "GLIBC_[0-9.]*" | sort -uV | tail -3
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload cef-v1 cef-server-linux-compat.so --clobber -R ${{ github.event.repository.full_name }}
